name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded run on the same branch has nothing left to say.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The shared gate runs axe over every component in every theme, which is
    # the slow half of the suite and worth the wall clock.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every color has to be var(--ac-*, var(--theme-*, #literal)) and the
      # middle link has to be a token theme-service actually defines. Cheap,
      # and it fails before anything is built.
      - name: Check tokens
        run: npm run check:tokens

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # playwright.config.mjs builds and serves the site itself, so this covers
      # `npm run build` too -- what is tested is what deploys, base path and all.
      - name: Test
        run: npx playwright test --project=chromium

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
