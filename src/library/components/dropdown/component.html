<!-- ===========================================================================
     DROPDOWN / LISTBOX — a styled select over a real <select>

     WHAT TO COPY
       Any one example below is self-contained. Take its section, plus the
       matching [CORE] sections of component.css and component.js.
       Copy all three files whole for the library-grade version.

     HOW IT WORKS
       You author a plain, labeled <select>. component.js hides it — keeping it
       in the DOM as the value store, so .value, change events and form
       submission all keep working — and builds the styled listbox beside it.

     THE CONTRACT (all of it built by the script)
       trigger  ->  button, aria-haspopup="listbox", aria-expanded,
                    aria-controls, aria-labelledby="<label id> <value id>"
       panel    ->  role="listbox", aria-labelledby="<label id>"
       option   ->  role="option", aria-selected, tabindex="-1"
       Your job is the <select> and its label.

     PER-OPTION DECORATION (all optional)
       data-ac-icon="<symbol id>"        <use href="#id"> from a sprite
       data-ac-swatch="#hex[,#hex,…]"    a color strip
       data-ac-secondary="text"          a muted second line

       Icons and swatches render aria-hidden, so they never reach the accessible
       name. Secondary text DOES — it is information, not decoration.

     ac-demo-* is scaffolding for this page only. Never copy it.
     =========================================================================== -->

<!-- Icon sprite for example 1. Anywhere on the page is fine; it renders nothing
     itself. Skip it entirely if you use no icons. -->
<svg hidden aria-hidden="true" focusable="false">
  <symbol id="ac-icon-rocket" viewBox="0 0 16 16">
    <path d="M8 1.5c2.5 1.4 4 4 4 6.6L10 11H6L4 8.1C4 5.5 5.5 2.9 8 1.5Z" fill="none"
          stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    <circle cx="8" cy="6.5" r="1.4" fill="currentColor" />
    <path d="M6 11.5 5 14.5l3-1.5 3 1.5-1-3" fill="none" stroke="currentColor"
          stroke-width="1.4" stroke-linejoin="round" />
  </symbol>
  <symbol id="ac-icon-flask" viewBox="0 0 16 16">
    <path d="M6.5 1.5v4L2.8 12A1.5 1.5 0 0 0 4.1 14.5h7.8A1.5 1.5 0 0 0 13.2 12L9.5 5.5v-4"
          fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" />
    <path d="M5.5 1.5h5M4.8 9.5h6.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  </symbol>
  <symbol id="ac-icon-laptop" viewBox="0 0 16 16">
    <rect x="2.5" y="3.5" width="11" height="7" rx="1" fill="none" stroke="currentColor" stroke-width="1.4" />
    <path d="M1 12.5h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  </symbol>
</svg>

<div class="ac-demo-grid">
  <!-- ======================================================================
       EXAMPLE 1 · Icons and secondary text
       CSS [FIELD] + [CORE] + [DECORATION]. JS [CORE] + [DECORATION].
       Also the type-ahead demo: open it and type "st".
       ====================================================================== -->
  <div class="ac-demo">
    <h3 class="ac-demo__title">1 &middot; Icons and secondary text</h3>

    <div class="ac-field">
      <label class="ac-field__label" for="ac-demo-env">Deploy target</label>
      <select id="ac-demo-env" data-ac-dropdown aria-describedby="ac-demo-env-hint">
        <option value="prod" data-ac-icon="ac-icon-rocket" data-ac-secondary="app.example.com" selected>
          Production
        </option>
        <option value="staging" data-ac-icon="ac-icon-flask" data-ac-secondary="staging.example.com">
          Staging
        </option>
        <option value="local" data-ac-icon="ac-icon-laptop" data-ac-secondary="localhost:3000">
          Local
        </option>
      </select>
      <!-- aria-describedby on the <select> is forwarded to the visible trigger. -->
      <p class="ac-field__hint" id="ac-demo-env-hint">
        Type the first letters of a name to jump to it.
      </p>
    </div>
  </div>

  <!-- ======================================================================
       EXAMPLE 2 · Groups, and an option nobody can choose
       CSS [FIELD] + [CORE] + [GROUPS] + [DISABLED]. JS [CORE] + [GROUPS].
       A disabled option stays in the list with aria-disabled rather than being
       removed, so a screen reader user learns it exists and why it is out.
       ====================================================================== -->
  <div class="ac-demo">
    <h3 class="ac-demo__title">2 &middot; Groups and a disabled option</h3>

    <div class="ac-field">
      <label class="ac-field__label" for="ac-demo-region">Region</label>
      <select id="ac-demo-region" data-ac-dropdown>
        <optgroup label="Americas">
          <option value="us-east">US East</option>
          <option value="us-west">US West</option>
          <option value="sa-east" disabled>South America (at capacity)</option>
        </optgroup>
        <optgroup label="Europe">
          <option value="eu-west" selected>EU West</option>
          <option value="eu-north">EU North</option>
        </optgroup>
      </select>
    </div>
  </div>

  <!-- ======================================================================
       EXAMPLE 3 · Color swatches
       CSS [FIELD] + [CORE] + [DECORATION]. JS [CORE] + [DECORATION].
       This is the site header's own theme picker in miniature. A swatch is the
       one place a literal color belongs in this library: it comes from the
       author's data, not the stylesheet.
       ====================================================================== -->
  <div class="ac-demo">
    <h3 class="ac-demo__title">3 &middot; Color swatches</h3>

    <div class="ac-field">
      <label class="ac-field__label" for="ac-demo-theme">Palette</label>
      <select id="ac-demo-theme" data-ac-dropdown>
        <option value="rink" data-ac-swatch="#ff2ec4,#5bff3a,#3ceaff" selected>Rink Classic</option>
        <option value="sunset" data-ac-swatch="#ff6b9d,#ffd166,#8b5cf6">Synthwave Sunset</option>
        <option value="acid" data-ac-swatch="#c6ff00,#00e5ff,#ff3d81">Acid Arcade</option>
      </select>
    </div>
  </div>

  <!-- ======================================================================
       EXAMPLE 4 · Disabled
       CSS [FIELD] + [CORE] + [DISABLED]. JS [CORE].
       The trigger gets aria-disabled, not the disabled attribute, so it stays
       focusable and a keyboard user can reach it and hear why it is locked.
       A disabled button is skipped by Tab and announces nothing.
       ====================================================================== -->
  <div class="ac-demo">
    <h3 class="ac-demo__title">4 &middot; Disabled</h3>

    <div class="ac-field">
      <label class="ac-field__label" for="ac-demo-locked">Billing plan</label>
      <select id="ac-demo-locked" data-ac-dropdown disabled>
        <option value="team" selected>Team (contact sales to change)</option>
      </select>
    </div>
  </div>

  <!-- ======================================================================
       EXAMPLE 5 · Empty
       CSS [FIELD] + [CORE] + [EMPTY]. JS [CORE].
       The state everyone forgets to design. Say what is missing rather than "no
       results" — data-ac-empty-text, or the default "No options available".
       ====================================================================== -->
  <div class="ac-demo">
    <h3 class="ac-demo__title">5 &middot; Empty</h3>

    <div class="ac-field">
      <label class="ac-field__label" for="ac-demo-empty">Saved filters</label>
      <select id="ac-demo-empty" data-ac-dropdown data-ac-empty-text="No saved filters yet"></select>
    </div>
  </div>
</div>
