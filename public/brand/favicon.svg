<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <style>
      /* Base Theme - 90s Neon Punk */
      .bridge-bg { fill: var(--a11y-theme-bg, transparent); }
      
      /* === The Alley Way (Background Perspective) === */
      /* Lower opacity pushes these lines into the background */
      .alley-wall { fill: none; stroke: var(--a11y-theme-secondary, #00F0FF); stroke-width: 3; stroke-linecap: round; opacity: 0.5; }
      .alley-floor { fill: none; stroke: var(--a11y-theme-secondary, #00F0FF); stroke-width: 2; stroke-linecap: round; opacity: 0.3; }
      .alley-path { fill: none; stroke: var(--a11y-theme-secondary, #00F0FF); stroke-width: 3; stroke-dasharray: 4 12; stroke-linecap: round; opacity: 0.8; }
      
      /* === The 'A' Bridge (Foreground Sweeping Tracks) === */
      .track-outer { fill: none; stroke: var(--a11y-theme-primary, #FF007F); stroke-width: 10; stroke-linecap: round; }
      .track-inner { fill: none; stroke: var(--a11y-theme-accent, #39FF14); stroke-width: 5; stroke-linecap: round; }
      .track-crossbar { fill: none; stroke: var(--a11y-theme-primary, #FF007F); stroke-width: 8; stroke-linecap: round; }
    </style>

    <!-- One rounded-tile shape, used twice: as the background plate and as the
         clip for the artwork. The alley lines and the outer track are drawn to
         the very edge of the 200x200 box, so without the clip they'd poke out
         past the softened corners and the square would read right back in. -->
    <clipPath id="tile">
      <rect width="200" height="200" rx="44" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">

  <!-- Optional Container -->
  <rect class="bridge-bg" width="200" height="200" rx="44" />

  <!-- ========================================== -->
  <!-- 1. BACKGROUND: THE ALLEY WAY                 -->
  <!-- ========================================== -->
  <!-- Left & Right receding walls/curbs -->
  <line class="alley-wall" x1="20" y1="190" x2="85" y2="80" />
  <line class="alley-wall" x1="180" y1="190" x2="115" y2="80" />
  
  <!-- Horizontal floor grid for 3D depth -->
  <line class="alley-floor" x1="38" y1="160" x2="162" y2="160" />
  <line class="alley-floor" x1="53" y1="135" x2="147" y2="135" />
  <line class="alley-floor" x1="68" y1="110" x2="132" y2="110" />
  <line class="alley-floor" x1="78" y1="92" x2="122" y2="92" />

  <!-- Center guiding dashed path leading under the arch -->
  <line class="alley-path" x1="100" y1="190" x2="100" y2="80" />

  <!-- ========================================== -->
  <!-- 2. FOREGROUND: THE 'A' BRIDGE              -->
  <!-- ========================================== -->
  <!-- Outer thick magenta track -->
  <path class="track-outer" d="M 25 170 C 50 170, 75 35, 100 25 C 125 35, 150 170, 175 170" />
  
  <!-- Inner crisp neon green track -->
  <path class="track-inner" d="M 50 170 C 70 170, 85 55, 100 45 C 115 55, 130 170, 150 170" />

  <!-- Sweeping crossbar -->
  <path class="track-crossbar" d="M 35 115 Q 100 135 165 115" />
  
  <!-- Accent nodes where the crossbar connects -->
  <circle cx="35" cy="115" r="5" fill="var(--a11y-theme-bg, #111118)" stroke="var(--a11y-theme-primary, #FF007F)" stroke-width="3" />
  <circle cx="165" cy="115" r="5" fill="var(--a11y-theme-bg, #111118)" stroke="var(--a11y-theme-primary, #FF007F)" stroke-width="3" />

  </g>
</svg>
